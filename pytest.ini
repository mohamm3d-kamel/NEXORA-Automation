[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/test-report.html --self-contained-html
markers =
    smoke: Quick sanity tests covering critical user journeys
    regression: Comprehensive regression test suite
    login: Authentication and login validations
    dashboard: Dashboard and navigation tests
    logout: Session termination and logout tests
    orders: Orders creation and management tests
    merchant: Merchant portal scenarios
    pickups: Pickup scheduling and driver assignment tests
    driver: Driver portal active pickups and verification
    finance: Finance module, COD Collection and Cash Transfer tests
    accounting: Accounting module tests
    sla: Service Level Agreement rules and tracking tests
    reports: Reports module generation, preview, export and download tests
    manifests: Delivery and Pickup Manifests management and verification tests
    tickets: Tickets management, customer/driver/ops support, conversation thread and lifecycle tests
    return_orders: Return orders creation, dispatch, Delivery, and Delivery Failed lifecycle tests
    b2b: B2B orders creation, approval flows, driver assignment, delay and cancellation tests
    valid: Valid happy-path scenarios
    invalid: Negative validation scenarios
    edge: Boundary and edge scenarios
    e2e: Cross-role end-to-end integration workflows
filterwarnings =
    ignore::DeprecationWarning
